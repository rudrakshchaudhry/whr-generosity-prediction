[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whr-generosity"
version = "1.0.0"
description = "Predicting World Happiness Report 2018 'Generosity' with reproducible scikit-learn pipelines and nested cross-validation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rudraksh Chaudhry" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.6",   # GroupKFold(shuffle=True) was added in 1.6
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "nbconvert>=7.16",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[project.scripts]
whr-generosity = "whr_generosity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
